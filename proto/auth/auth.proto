syntax = "proto3";

package github.chas3air.protos.auth;

option go_package = "chas3air.auth.v1;authv1";

// Auth service provides operations for user authentication and authorization.
service Auth {
    // Login verifies user credentials and returns access and refresh tokens.
    rpc Login (LoginRequest) returns (LoginResponse);

    // Logout invalidates the user's current access token.
    rpc Logout(LogoutRequest) returns (LogoutResponse);

    // IsAdmin checks if the specified user has administrative privileges.
    rpc IsAdmin (IsAdminRequest) returns (IsAdminResponse);

    // RefreshToken generates a new access token using a valid refresh token.
    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

message LoginRequest {
    string login = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
}

message LogoutRequest {
    string access_token = 1;
}

message LogoutResponse {
    bool logged_out = 1;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}

message RefreshTokenResponse {
    string access_token = 1;
}

message IsAdminRequest {
    string user_id = 1;
}

message IsAdminResponse {
    bool is_admin = 1;
}
